<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>space example</title>
<link rel="stylesheet" href="lib/fx.css" />
<script src="lib/vendor/gsap.min.js"></script>
<script src="lib/fx.js"></script>
<script src="lib/fx-particles.js"></script>
<style>
  .cam { position: absolute; inset: 0; }
  .top { position: absolute; left: 0; right: 0; text-align: center; }
  .top .t-title, .top .t-hero { display: inline-block; }
  .cyan { color: #6fd3ff; } .orange { color: #ff8a4d; }
  .mono { font-family: var(--fx-font-mono); letter-spacing: .12em; color: #8fa9c9; font-size: 30px; }
</style>
</head>
<body>
<div id="root" class="theme-space" data-composition-id="main" data-width="1920" data-height="1080">

<!-- 0 风格标题卡 -->
<section class="scene center" id="title" data-d="1.8" style="background:#171719;color:#fff">
  <div class="t-title" style="font-size:190px;text-shadow:none;color:#fff" data-fx="blur-rise-in@0.05">深空粒子</div>
  <div class="t-mono" style="font-size:44px;margin-top:34px;color:#fff;text-shadow:none" data-fx="blur-rise-in@0.25">.theme-space</div>
  <div class="t-small" style="font-size:28px;margin-top:20px;color:#fff;text-shadow:none" data-fx="blur-rise-in@0.45">motion-lib example</div>
</section>

<!-- a 星尘聚成能量球 -->
<section class="scene" id="a" data-d="6" data-in="blur-cross(dur=0.5)">
  <div class="cam" data-fx="push@0(from=1,to=1.08,dur=6)">
    <div class="layer" data-make="space" data-fx="nebula@0 starfield@0(speed=0.04,n=520) orb@0.3(in=2.6,x=50,y=55,r=230,detail=1)"></div>
  </div>
  <div class="top" style="top:90px">
    <div class="t-en" style="font-size:26px;margin-bottom:22px" data-fx="focus-in@0.3">IDEA · 01</div>
    <div class="t-title" style="font-size:84px" data-fx="chars:blur-in@0.6(stagger=0.06,dur=0.7) shimmer@3.2">每个想法，都从一粒尘埃开始</div>
  </div>
</section>

<!-- b 旋涡 -->
<section class="scene" id="b" data-d="6" data-in="zoom-through(dur=0.5)">
  <div class="cam" data-fx="to@0(scale=1.0,dur=0.01) to@0.2(scale=1.22,dur=5.6,ease=linear)">
    <div class="layer" data-make="space" data-fx="nebula@0(colors=#1f4fa5/#5a2f9a/#123a7a) starfield@0(speed=0.04,n=300) vortex@0.2"></div>
  </div>
  <div class="top" style="top:90px">
    <div class="t-en" style="font-size:26px;margin-bottom:22px" data-fx="focus-in@0.3">IDEA · 02</div>
    <div class="t-hero" style="font-size:150px" data-fx="blur-rise-in@0.5 glitch@3.0(dur=0.5)">越想，越深</div>
  </div>
  <div class="top" style="top:800px;font-size:34px" data-fx="fade-in@1.2">
    <span class="mono">想了 </span><span class="t-num cyan" style="font-size:60px" data-fx="count@1.3(dur=3.5)">128</span><span class="mono"> 遍</span>
  </div>
</section>

<!-- c 黑洞 -->
<section class="scene" id="c" data-d="6.2" data-in="blur-cross(dur=0.7)">
  <div class="cam" data-fx="push@0(from=1,to=1.06,dur=6.2)">
    <div class="layer" data-make="space" data-fx="nebula@0(colors=#1b3f8f/#27408b/#0f2a66,alpha=0.8) starfield@0(speed=0,n=400) blackhole@0.2(r=170,y=52)"></div>
  </div>
  <div class="top" style="top:90px">
    <div class="t-en" style="font-size:26px;margin-bottom:22px" data-fx="focus-in@0.4">IDEA · 03</div>
    <div class="t-title" style="font-size:96px" data-fx="blur-rise-in@0.8"><span data-fx="true-focus@1.6(every=1.0)">卡/住/了</span></div>
  </div>
</section>

<!-- d 炸开 -->
<section class="scene" id="d" data-d="5.6" data-in="flash(dur=0.4,color=#ffffff)">
  <div class="cam" data-fx="cam-shake@1.9">
    <div class="layer" data-make="space" data-fx="nebula@0 starfield@0(speed=0.3,streak=1.6,n=700) orb@0(explode=1.9,r=210,y=52,out=0.3,dur=3.5) burst@1.9(n=900,shards=0.35,y=52,life=3.4)"></div>
  </div>
  <div class="top" style="top:90px">
    <div class="t-en" style="font-size:26px;margin-bottom:22px" data-fx="focus-in@0.3">IDEA · 04</div>
    <div class="t-hero" style="font-size:130px;color:#ff8a4d;text-shadow:0 0 30px rgba(255,138,77,.55)" data-fx="stamp-in@1.9">灵光一闪</div>
  </div>
</section>

<!-- e 粒子流 + 聚字 -->
<section class="scene" id="e" data-d="6.2" data-in="iris(dur=0.6)">
  <div class="layer" data-make="space" data-fx="nebula@0 starfield@0(speed=0.05,n=300) stream@0(n=240) form-text@0.2(text=想通了,size=330,y=46,start=0.3,conv=2.6,weight=700)"></div>
  <div class="top" style="top:90px">
    <div class="t-en" style="font-size:26px;margin-bottom:22px" data-fx="focus-in@0.3">IDEA · 05</div>
  </div>
  <div class="top" style="top:720px" data-fx="blur-rise-in@3.4">
    <span class="t-title cyan" style="font-size:56px" data-fx="rotate-words@4(words=线索/碎片/灵感/答案,every=0.55)">线索</span><span class="t-title" style="font-size:56px"> 汇成一条线</span>
  </div>
</section>

<!-- f 落成作品 -->
<section class="scene" id="f" data-d="8.2" data-in="blur-cross(dur=0.6)">
  <div class="cam" data-fx="push@0(from=1,to=1.05,dur=8.2)">
    <div class="layer" data-make="space" data-fx="nebula@0 starfield@0(speed=0.04,n=500) form-text@0.3(text=IDEA,size=420,y=42,start=0.3,conv=2.8,weight=700,spacing=20)"></div>
  </div>
  <div class="top" style="top:690px">
    <div class="t-en" style="font-size:34px;margin-bottom:26px" data-fx="blur-rise-in@3.6">MOTION-LIB</div>
    <div class="mono" style="font-size:40px;color:#6fd3ff" data-fx="blur-rise-in@4.0">motion-lib · theme-space</div>
  </div>
  <div data-fx="fade-out@-0.5" style="position:absolute;inset:0;pointer-events:none"></div>
</section>
</div>

<script>
  FX.subtitles([
    [2.0, 7.6, '每个想法，都从{一粒尘埃}开始'],
    [8.0, 13.6, '越想，就卷得{越深}'],
    [14.0, 19.6, '然后，{卡住}了。四周很安静'],
    [20.2, 24.8, '直到某一刻，{轰}的一声'],
    [25.8, 31.4, '碎片归位，{想通了}'],
    [32.2, 39.6, '最后，落成一件{作品}']
  ], { style: 'plain' });
  FX.build();
</script>
</body>
</html>
