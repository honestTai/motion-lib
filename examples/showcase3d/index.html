<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>motion-lib · 工业级 3D 硬件拆解与光学动力学展台（fx-showcase3d）</title>
<link rel="stylesheet" href="lib/fx.css" />
<script src="lib/vendor/gsap.min.js"></script>
<script src="lib/vendor/three-fx.min.js"></script>
<script src="lib/vendor/three-vrm.min.js"></script>
<script src="lib/assets/showcase3d/models-b64.js"></script>
<script src="lib/fx.js"></script>
<script src="lib/fx-world.js"></script>
<script src="lib/fx-showcase3d.js"></script>
<script src="lib/fx-sound.js"></script>
<style>
  #root .fx-world-bg { background: #04070e; }
  .scene.panel.sc-bg-cyan   { background: radial-gradient(95% 85% at 52% 54%, #10243e 0%, #091120 52%, #04070f 100%); }
  .scene.panel.sc-bg-indigo { background: radial-gradient(95% 85% at 52% 54%, #17203f 0%, #0b1022 54%, #050711 100%); }
  .scene.panel.sc-bg-amber  { background: radial-gradient(95% 85% at 52% 54%, #2d1b12 0%, #120d10 54%, #060609 100%); }
  .scene.panel.sc-bg-green  { background: radial-gradient(95% 85% at 52% 54%, #0d2922 0%, #081415 54%, #04080a 100%); }
  .scene.panel.sc-bg-violet { background: radial-gradient(95% 85% at 52% 54%, #1e163b 0%, #0c0d1f 54%, #05060e 100%); }
  .scene.panel.sc-bg-gold   { background: radial-gradient(95% 85% at 52% 54%, #262015 0%, #0f111a 54%, #05070d 100%); }

  .sc-head {
    position: absolute; left: 108px; top: 60px; z-index: 8; pointer-events: none;
    display: flex; flex-direction: column; gap: 6px;
  }
  .sc-kicker {
    font-family: var(--fx-font-mono); font-size: 32px; font-weight: 700;
    letter-spacing: .14em; color: var(--sc-ac, #38bdf8);
  }
  .sc-title {
    margin: 0; font-family: var(--fx-font-title); font-size: 56px; font-weight: 900;
    line-height: 1.15; letter-spacing: -.015em; color: #f8fafc;
  }
  .sc-spec {
    position: absolute; right: 108px; top: 68px; z-index: 8; pointer-events: none;
    padding: 10px 26px; border-radius: 999px;
    font-family: var(--fx-font-mono); font-size: 32px; font-weight: 700;
    color: #e2e8f0; background: rgba(15, 23, 42, .68);
    border: 1px solid rgba(148, 163, 184, .26);
  }
</style>
</head>
<body>
<div id="root" class="theme-studio" data-composition-id="main" data-width="1920" data-height="1080" data-fps="60" data-world="snake" data-cols="3">

  <!-- S01 · 苹果发布会风 5 层可拆解 AI 算力芯片（chip3d：chip-explode + showcase-orbit + chip-assemble） -->
  <section class="scene panel sc-bg-cyan" data-scene="S01" data-d="4.2">
    <div class="layer" data-make="chip3d"
         data-accent="#38bdf8"
         data-dist="10.4"
         data-look-y="0.02"
         data-label="M5 ULTRA|16-CORE NEURAL SOC"
         data-callouts="镀金 BGA 触点阵列,多层高速纤维基板,神经网络发光晶圆,CNC 铝合金加固环,拉丝钛金属散热盖"
         data-fx="chip-explode@0.2(dur=1.4,spread=0.96,spin=20) showcase-orbit@1.6(rx=22,ry=-22,zoom=1.08,dur=1.3) chip-assemble@3.05(dur=0.9)"></div>
    <div class="sc-head" style="--sc-ac:#38bdf8" data-fx="blur-rise-in@0(dur=0.45)">
      <div class="sc-kicker">01 · AI SILICON</div>
      <h2 class="sc-title">五层可拆解算力芯片</h2>
    </div>
    <div class="sc-spec" data-fx="fade-in@0.1(dur=0.4)">chip3d · 81 Pins</div>
  </section>

  <!-- S02 · 极简阳极氧化铝 3D 笔记本转轴开合（laptop3d：laptop-open + showcase-orbit） -->
  <section class="scene panel sc-bg-indigo" data-scene="S02" data-d="4.2">
    <div class="layer" data-make="laptop3d"
         data-accent="#60a5fa"
         data-dist="10.8"
         data-look-y="-0.08"
         data-title="motion-lib · AI 3D Studio Pipeline"
         data-fx="laptop-open@0.25(dur=1.5,turn=24) showcase-orbit@1.85(rx=14,ry=-10,zoom=1.06,dur=1.6)"></div>
    <div class="sc-head" style="--sc-ac:#60a5fa" data-fx="blur-rise-in@0(dur=0.45)">
      <div class="sc-kicker">02 · UNIBODY PRO</div>
      <h2 class="sc-title">真实转轴开盖与漫反射</h2>
    </div>
    <div class="sc-spec" data-fx="fade-in@0.1(dur=0.4)">laptop3d · 65 Keys</div>
  </section>

  <!-- S03 · 客制化机械轴联排敲击与微距五层拆解（keycap3d：key-press3d + key-explode3d + showcase-orbit） -->
  <section class="scene panel sc-bg-amber" data-scene="S03" data-d="4.2">
    <div class="layer" data-make="keycap3d"
         data-accent="#fb923c"
         data-keys="CMD,A,I"
         data-subs="KEY,AGENT,RUN"
         data-dist="12.4"
         data-look-y="-0.26"
         data-fx="key-press3d@0.3(dur=0.55,stagger=0.14) key-explode3d@1.35(dur=1.35,spread=0.88) showcase-orbit@1.5(rx=18,ry=-22,zoom=1.04,dur=1.8)"></div>
    <div class="sc-head" style="--sc-ac:#fb923c" data-fx="blur-rise-in@0(dur=0.45)">
      <div class="sc-kicker">03 · MECH SWITCH</div>
      <h2 class="sc-title">螺旋弹簧微距轴体拆解</h2>
    </div>
    <div class="sc-spec" data-fx="fade-in@0.1(dur=0.4)">keycap3d · Coil</div>
  </section>

  <!-- S04 · AI 数据中心热插拔刀片服务器机柜（rack3d：rack-boot3d + blade-slide3d + showcase-orbit） -->
  <section class="scene panel sc-bg-green" data-scene="S04" data-d="4.2">
    <div class="layer" data-make="rack3d"
         data-accent="#34d399"
         data-dist="11.6"
         data-look-y="-0.06"
         data-blades="NODE 01 · GEMINI,NODE 02 · CLAUDE,NODE 03 · GPT-6.2,NODE 04 · HROUTER"
         data-fx="rack-boot3d@0.25(dur=1.25) blade-slide3d@1.45(i=2,dist=0.95,dur=0.9) showcase-orbit@1.6(rx=16,ry=-18,zoom=1.06,dur=1.6)"></div>
    <div class="sc-head" style="--sc-ac:#34d399" data-fx="blur-rise-in@0(dur=0.45)">
      <div class="sc-kicker">04 · BLADE RACK</div>
      <h2 class="sc-title">光纤点火与热插拔抽拉</h2>
    </div>
    <div class="sc-spec" data-fx="fade-in@0.1(dur=0.4)">rack3d · 4U</div>
  </section>

  <!-- S05 · 光学水晶三棱镜激光色散路由（prism3d：prism-split3d + showcase-orbit） -->
  <section class="scene panel sc-bg-violet" data-scene="S05" data-d="4.2">
    <div class="layer" data-make="prism3d"
         data-accent="#a78bfa"
         data-dist="9.4"
         data-look-y="0.02"
         data-in-label="单条指令输入"
         data-out-labels="Gemini · 策划文案,Claude · 前端排版,GPT-6.2 · 3D 建模"
         data-fx="prism-split3d@0.25(dur=1.55) showcase-orbit@1.85(rx=12,ry=-8,zoom=1.06,dur=1.6)"></div>
    <div class="sc-head" style="--sc-ac:#a78bfa" data-fx="blur-rise-in@0(dur=0.45)">
      <div class="sc-kicker">05 · OPTIC PRISM</div>
      <h2 class="sc-title">水晶棱镜多模光谱分束</h2>
    </div>
    <div class="sc-spec" data-fx="fade-in@0.1(dur=0.4)">prism3d · IOR 1.58</div>
  </section>

  <!-- S06 · 三轴精密万向陀螺中枢差速运转与同心磁吸锁定（gyro3d：gyro-spin3d + gyro-lock3d + showcase-orbit） -->
  <section class="scene panel sc-bg-gold" data-scene="S06" data-d="4.2">
    <div class="layer" data-make="gyro3d"
         data-accent="#fbbf24"
         data-dist="10.4"
         data-look-y="-0.02"
         data-nodes="Planner,Renderer,Verifier"
         data-fx="gyro-spin3d@0(dur=2.55,speed=1.35) gyro-lock3d@2.5(dur=0.95) showcase-orbit@2.5(rx=8,ry=0,zoom=1.08,dur=1.1)"></div>
    <div class="sc-head" style="--sc-ac:#fbbf24" data-fx="blur-rise-in@0(dur=0.45)">
      <div class="sc-kicker">06 · GIMBAL CORE</div>
      <h2 class="sc-title">万向差速与同心磁吸锁</h2>
    </div>
    <div class="sc-spec" data-fx="fade-in@0.1(dur=0.4)">gyro3d · 3-Axis</div>
  </section>

</div>
<script>
  FX.subtitles([
    [0.25, 3.85, '苹果发布会级{五层芯片拆解}，锚点引线实时跟随'],
    [4.55, 8.05, '阳极氧化铝一体机身，绕{真实物理转轴}点亮开盖'],
    [8.75, 12.25, '三维镀金螺旋弹簧真实压缩，{微距五层}悬停分解'],
    [12.95, 16.45, '两侧光纤涌入脉冲，四台算力刀片{独立抽拉}展示'],
    [17.15, 20.65, '一束白光射入高透水晶棱镜，折射出{多路光谱路由}'],
    [21.35, 24.95, '正交三环高速差速运转，瞬间{同心归零}磁吸锁定']
  ], { style: 'studio' });
  FX.build();
</script>
</body>
</html>
