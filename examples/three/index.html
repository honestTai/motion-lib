<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>three example</title>
<link rel="stylesheet" href="lib/fx.css" />
<script src="lib/vendor/gsap.min.js"></script>
<script src="lib/vendor/three-fx.min.js"></script>
<script src="lib/fx.js"></script>
<script src="lib/fx-3d.js"></script>
<style>
  .top { position: absolute; left: 0; right: 0; text-align: center; }
  .top .t-title, .top .t-hero { display: inline-block; }
  .cyan { color: #6fd3ff; } .orange { color: #ff8a4d; }
  .mono { font-family: var(--fx-font-mono); letter-spacing: .12em; color: #8fa9c9; font-size: 30px; }
</style>
</head>
<body>
<div id="root" class="theme-space" data-composition-id="main" data-width="1920" data-height="1080">

<section class="scene center" id="title" data-d="1.8" style="background:#171719;color:#fff">
  <div class="t-title" style="font-size:190px;text-shadow:none;color:#fff" data-fx="blur-rise-in@0.05">真 3D 场景</div>
  <div class="t-mono" style="font-size:44px;margin-top:34px;color:#fff;text-shadow:none" data-fx="blur-rise-in@0.25">fx-3d.js</div>
  <div class="t-small" style="font-size:28px;margin-top:20px;color:#fff;text-shadow:none" data-fx="blur-rise-in@0.45">motion-lib example</div>
</section>

<!-- a 星系 + 能量球 -->
<section class="scene" id="a" data-d="6" data-in="blur-cross(dur=0.5)">
  <div class="layer" data-make="stage3d" data-cam="34,22,34" data-fx="stars3d@0 galaxy3d@0 orb3d@0(in=1.8,explode=5.3) orbit3d@0(turn=110,r=13,h=5,dur=6,ease=inout)"></div>
  <div class="top" style="top:90px">
    <div class="t-en" style="font-size:26px;margin-bottom:22px" data-fx="focus-in@0.3">STAR · 01</div>
    <div class="t-title" style="font-size:84px" data-fx="chars:blur-in@0.6(stagger=0.06,dur=0.7) shimmer@3.2">从一颗星开始</div>
  </div>
</section>

<!-- b 爆开 + 隧道 -->
<section class="scene" id="b" data-d="6" data-in="flash(dur=0.4,color=#ffffff)">
  <div class="layer" data-make="stage3d" data-cam="0,0,0" data-look="0,0,-50" data-fx="tunnel3d@0 burst3d@0(pz=-14,life=2.5) cam3d@0(fov=75,dur=6)"></div>
  <div class="top" style="top:90px">
    <div class="t-en" style="font-size:26px;margin-bottom:22px" data-fx="focus-in@0.3">STAR · 02</div>
    <div class="t-hero" style="font-size:130px" data-fx="blur-rise-in@0.5 glitch@3.2(dur=0.5)">穿过去</div>
  </div>
  <div class="top" style="top:770px" data-fx="fade-in@1.2">
    <span class="mono">已飞行 </span><span class="t-num cyan" style="font-size:60px" data-fx="count@1.3(dur=4)">4096</span><span class="mono"> 光年</span>
  </div>
</section>

<!-- c 黑洞 -->
<section class="scene" id="c" data-d="6.5" data-in="zoom-through(dur=0.5)">
  <div class="layer" data-make="stage3d" data-cam="16,3,14" data-fx="stars3d@0 blackhole3d@0 orbit3d@0(turn=70,h=1.2,dur=6.5)"></div>
  <div class="top" style="top:90px">
    <div class="t-en" style="font-size:26px;margin-bottom:22px" data-fx="focus-in@0.4">STAR · 03</div>
    <div class="t-title" style="font-size:96px" data-fx="blur-rise-in@0.8"><span data-fx="true-focus@1.6(every=1.0)">被/吞/没/了</span></div>
  </div>
</section>

<!-- d 城市 -->
<section class="scene" id="d" data-d="9" data-in="blur-cross(dur=0.7)">
  <div class="layer" data-make="stage3d" data-bg="#1a1230" data-fog="0.003" data-bloom="0.6" data-cam="0,90,70" data-look="0,10,-180" data-fx="city3d@0 cam3d@0.2(x=0,y=7,z=-170,lx=0,ly=16,lz=-460,dur=5.8) cam3d@6.2(x=0,y=8,z=-300,lx=0,ly=18,lz=-480,dur=2.6,ease=out)"></div>
  <div class="abs" style="left:120px;top:110px;text-align:left;text-shadow:0 2px 14px rgba(0,0,0,.9)">
    <div class="t-en" style="font-size:26px;margin-bottom:22px" data-fx="focus-in@0.3">CITY · 04</div>
    <div class="t-title" style="font-size:96px" data-fx="chars:blur-in@0.6(stagger=0.08,dur=0.7) shimmer@4">一座城亮了</div>
  </div>
</section>

<!-- e 点阵球 + 波浪 -->
<section class="scene" id="e" data-d="6" data-in="iris(dur=0.6)">
  <div class="layer" data-make="stage3d" data-cam="0,10,24" data-look="0,4,0" data-fx="stars3d@0 waves3d@0(py=-3) globe3d@0(py=5.5,r=5) orbit3d@0(turn=40,dur=6)"></div>
  <div class="top" style="top:90px">
    <div class="t-en" style="font-size:26px;margin-bottom:22px" data-fx="focus-in@0.3">NET · 05</div>
    <div class="t-title" style="font-size:84px" data-fx="blur-rise-in@0.6">把一切，连起来</div>
  </div>
</section>

<!-- f 立体字 -->
<section class="scene" id="f" data-d="7" data-in="blur-cross(dur=0.6)">
  <div class="layer" data-make="stage3d" data-bloom="0.3" data-cam="-14,3,22" data-fx="stars3d@0 burst3d@0.2 text3d@0.6(text=三维,w=16,py=3,start=0.2,conv=2.4) orbit3d@0(turn=-35,dur=7,ease=out)"></div>
  <div class="top" style="top:90px">
    <div class="t-en" style="font-size:26px;margin-bottom:22px" data-fx="focus-in@0.3">END · 06</div>
  </div>
  <div class="top" style="top:760px">
    <div class="mono" style="font-size:40px;color:#6fd3ff" data-fx="blur-rise-in@3.6">motion-lib · fx-3d.js</div>
  </div>
</section>
</div>

<script>
  FX.subtitles([
    [2.0, 7.6, '一颗星，聚成{能量球}'],
    [8.0, 13.6, '{轰}的一声，穿过粒子隧道'],
    [14.0, 20.0, '再往深处，是{黑洞}'],
    [20.6, 29.0, '俯冲而下，一座{城市}亮起灯'],
    [29.6, 35.0, '点与点之间，{连成网}'],
    [35.6, 42.0, '最后，落成两个字：{三维}']
  ], { style: 'plain' });
  FX.build();
</script>
</body>
</html>
