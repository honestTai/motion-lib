<!doctype html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920, height=1080">
<title>motion-lib · 舞台剧示例：主持人 + 场景 + 画中画</title>
<link rel="stylesheet" href="lib/fx.css">
<script src="lib/vendor/gsap.min.js"></script>
<script src="lib/fx.js"></script>
<script src="lib/fx-world.js"></script>   <!-- 只用它的焦点动效（push-back、wake）；不写 data-world 就不会启用世界画布 -->
<script src="lib/fx-puppet.js"></script>
<script src="lib/fx-stage.js"></script>
<style>
  .doc { padding: 34px 44px; color: #1d1b19; }
  .doc h4 { font-size: 60px; font-weight: 900; line-height: 1.2; }
  .doc p { margin-top: 22px; font-size: 44px; font-weight: 700; line-height: 1.5; }
</style>
</head><body>
<!-- 舞台剧语法：不写 data-world。分镜之间默认硬切；换场景背景时用 data-in="mosaic" -->
<div id="root" class="theme-pixel" data-composition-id="main" data-width="1920" data-height="1080" data-mode="stage">

  <!-- 1 画中画：笔记本里的内容每 1.4 秒硬切一次；最后钻进屏幕 -->
  <section class="scene" data-d="6.4" data-fx="call@0(who=bot) pup-talk@0.3(who=bot,dur=5.4) pup-pose@3(who=bot,pose=point)">
    <div class="fx-sign tilt" style="left:760px;top:96px" data-fx="drop-bounce@0.4">设备屏 · 钻进屏幕</div>
    <div class="abs" style="left:700px;top:250px;width:960px;height:620px" data-make="device" data-kind="laptop"
         data-fx="screen-to@1.6 screen-to@3.0 screen-to@4.4 dive@5.9(dur=0.5)">
      <img src="assets/violet.jpg" alt=""><img src="assets/gold.jpg" alt=""><img src="assets/space.jpg" alt="">
      <div data-make="backdrop" data-kind="field" data-seed="3"></div>
    </div>
  </section>

  <!-- 2 走进屏幕里的场景：小演员走进来，头顶弹选择面板；中途切一张全屏插画 -->
  <section class="scene" data-d="7.2" data-fx="pup-talk@0.2(who=bot,dur=6.6) pup-pose@1.6(who=bot,pose=think) pup-pose@5.4(who=bot,pose=cheer)">
    <div data-make="backdrop" data-kind="field" data-seed="3"></div>
    <div class="fx-sign" style="left:760px;top:96px" data-fx="drop-bounce@0.3">小演员 · 插画</div>
    <div class="abs" style="left:1940px;top:508px;width:200px;height:250px" data-make="mini" data-src="lib/assets/puppet/mini" data-poses="walk1/walk2/cheer" data-tag="小演员"
         data-fx="mini-walk@0.3(x=-700) mini-pose@5.4(name=cheer) hop@5.4"></div>
    <div class="abs" style="left:1170px;top:190px" data-make="menu" data-title="下一步？" data-items="后撤/冲上去/挖方块" data-fx="pop-in@1.6 choose@2.0(i=2/3/1,every=0.42)"></div>
    <img src="lib/assets/puppet/cut_desk.svg" alt="" data-fx="cutaway@3.4(dur=1.9)">
  </section>

  <!-- 3 换场景：马赛克（主持人不被盖住）。先给一个脸部特写；信息窗口只停两三秒，弹出时背景压暗，收掉后亮回来 -->
  <section class="scene" data-d="7.0" data-in="mosaic"
           data-fx="closeup@0.5(who=bot,dur=1.0,pose=think,kind=question,color=blue) pup-talk@1.5(who=bot,dur=5) pup-pose@1.5(who=bot,pose=point) pup-pose@4.8(who=bot,pose=wave)">
    <div data-make="backdrop" data-kind="room" data-fx="push-back@1.7(s=1,blur=3,dim=0.5) bring-front@4.8"></div>
    <div class="abs" style="left:700px;top:230px;width:1060px;height:440px" data-make="device" data-kind="window" data-title="官方说明" data-fx="scale-in@1.7(dur=0.25) fade-out@4.7(dur=0.2)">
      <div class="doc">
        <h4>窗口里只放一两行</h4>
        <p><span data-fx="marker@2.9">荧光笔刷过重点</span></p>
      </div>
    </div>
    <div class="fx-sign dark" style="left:820px;top:300px" data-fx="stamp-in@5.0">脸部特写 · 信息窗口</div>
  </section>

  <!-- 4 同一章里换场景：硬切。信息是立在场景里的道具：牌子 + 两个大数字 -->
  <section class="scene" data-d="6.0" data-fx="pup-pose@0(who=bot,pose=think) pup-talk@0.2(who=bot,dur=5.2) pup-pose@2.2(who=bot,pose=cheer) pup-emote@2.4(who=bot,kind=sparkle)">
    <div data-make="backdrop" data-kind="city"></div>
    <div class="fx-sign" style="left:860px;top:110px" data-fx="drop-bounce@0.3">道具，不是面板</div>
    <div class="fx-score" style="left:800px;top:290px">
      <div class="lose" data-fx="pop-in@1.2"><b>5行</b><span>面板里的字</span></div>
      <div class="win" data-fx="pop-in@2.2 pulse@4.0"><b>1个</b><span>立着的数字</span></div>
    </div>
    <div class="abs" style="left:1960px;top:600px;width:200px;height:250px" data-make="mini" data-src="lib/assets/puppet/mini" data-poses="walk1/walk2/cheer"
         data-fx="mini-walk@0.2(x=-420) mini-pose@2.4(name=cheer) hop@2.4 hop@4.6"></div>
  </section>

  <!-- 常驻层：进度线 + 主持人（声明一次，全片可用） -->
  <section class="scene overlay" data-t="0" data-d="26.6">
    <div class="abs" style="left:60px;right:60px;top:30px" data-make="segments" data-n="4" data-fx="segment@0(i=1) segment@6.4(i=2) segment@13.6(i=3) segment@20.6(i=4)"></div>
    <div data-make="actor" data-name="bot" data-src="lib/assets/puppet/bot" data-poses="wave/point/think/cheer"
         data-eyes="238,236,64,76,#7fe7ff/362,236,64,76,#7fe7ff" data-neck="300,400" data-home="-10,0,640"></div>
  </section>
</div>
<script>
  var say = ['画中画：屏幕里的内容{硬切}，再{钻进去}', '进到场景里，{小演员}来演，中途切{全屏插画}', '换场景用{马赛克}，再给一个{脸部特写}', '信息是场景里的{道具}，不是面板'], t = 0, cues = [];
  document.querySelectorAll('#root > .scene:not(.overlay)').forEach(function (s, i) { var d = +s.getAttribute('data-d'); cues.push([t + 0.3, t + d - 0.25, say[i]]); t += d; });
  FX.subtitles(cues, { style: 'studio' });
  FX.build();
</script>
</body></html>
