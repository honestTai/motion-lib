<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>FX demo</title>
<link rel="stylesheet" href="lib/fx.css" />
<script src="lib/vendor/gsap.min.js"></script>
<script src="lib/fx.js"></script>
<style>
  .grid3 { display: grid; grid-template-columns: repeat(3, 440px); gap: 40px; }
  .grid3 .card { height: 300px; display: flex; flex-direction: column; justify-content: space-between; }
</style>
</head>
<body>
<div id="root" class="theme-violet" data-composition-id="main" data-width="1920" data-height="1080">

  <!-- 1 深色：时钟 + 聊天卡片 -->
  <section class="scene dark" id="s1" data-d="4">
    <div class="abs row" style="left:96px;top:70px;gap:18px" data-fx="fade-in@0.1">
      <span class="accent" style="font-size:44px">☾</span>
      <span class="t-num" style="font-size:110px" data-fx="clock@0.4(from=23:28,to=01:23,dur=1.6)">23:28</span>
    </div>
    <div class="abs fx-chat" style="left:380px;top:330px;width:1000px" data-fx="blur-rise-in@0.6">
      <div class="fx-chat-who"><span class="av">F</span>Fred → Claude Code <time>11-12 23:28</time></div>
      <div class="fx-chat-msg" data-fx="type@1.0(cps=22,caret=1)">今天有一个新的热点新闻，帮我做一个深度的洞察。</div>
    </div>
  </section>

  <!-- 2 白底：三张卡片错峰入场 + 数字滚动 + 荧光笔 -->
  <section class="scene light center" id="s2" data-d="4.5" data-in="blur-cross(dur=0.45)">
    <h2 class="t-title" data-fx="mask-rise@0.1">效率 · <span data-fx="marker@1.6">质量</span> · 速度</h2>
    <div class="grid3" style="margin-top:70px" data-fx="each:rise-in@0.5(stagger=0.12,dist=60)">
      <div class="card"><span class="t-small">一期只花</span><span class="t-num accent" style="font-size:140px" data-fx="count@0.8(dur=1.2)">30</span><span class="t-h3">分钟</span></div>
      <div class="card"><span class="t-small">单期播放</span><span class="t-num accent" style="font-size:140px" data-fx="count@0.9(dur=1.4)">400</span><span class="t-h3">万</span></div>
      <div class="card"><span class="t-small">热点出片</span><span class="t-num accent" style="font-size:140px">&lt;2</span><span class="t-h3">小时</span></div>
    </div>
  </section>

  <!-- 3 深色：柱状图生长 + 高亮 + 圆环 -->
  <section class="scene dark" id="s3" data-d="4" data-in="zoom-through">
    <div class="abs" style="left:96px;top:90px" data-fx="slide-in@0.1(dir=right,dist=80)"><span class="t-h2">每小时新增播放</span></div>
    <div class="abs" style="left:96px;top:260px;width:1100px;height:520px" data-make="bars" data-values="2,3,5,9,30,48,40,26,18,12,9,7,5,4,3,2,2,1" data-hi="6,7" data-fx="each:grow-y@0.4(stagger=0.035)"></div>
    <div class="abs center" style="left:1380px;top:300px" data-make="ring" data-size="380" data-stroke="20" data-fx="ring@0.6(to=0.72,dur=1.6) pop-in@0.3">
      <span class="t-num" style="font-size:110px" data-fx="count@0.6(dur=1.6)">72%</span>
    </div>
  </section>

  <!-- 4 白底：步骤胶囊 + 截图卡推近 + 黑色标注 + 光标点击 -->
  <section class="scene light" id="s4" data-d="5" data-in="wipe(dir=left)">
    <div class="abs" style="left:96px;top:64px" data-make="steps" data-labels="选题,找素材,写稿,配音字幕,剪辑,封面发布" data-fx="fade-in@0.1 step@0.4(i=1) step@1.6(i=2) step@2.8(i=3)"></div>
    <div class="layer" id="cam4">
      <div class="abs fx-window light" id="win4" style="left:300px;top:200px;width:1320px;height:720px" data-fx="tilt-in@0.2">
        <div class="fx-win-bar">fred-fu.com / workflow</div>
        <div class="fx-win-body col" style="gap:22px">
          <div class="t-h3">自动工作流</div>
          <div class="row" id="hot4" style="gap:16px"><span class="pill">01 搜热点</span><span class="pill">02 下素材</span><span class="pill accent">03 生成画面</span></div>
          <div class="t-body muted">每个窗口同时跑，不用一步一步等。</div>
        </div>
      </div>
      <span class="abs note" style="left:1220px;top:470px" data-fx="pop-in@2.3">这一步最关键</span>
      <i class="fx-cursor" style="left:1500px;top:820px" data-fx="fade-in@1.2 move@1.4(to=#hot4,dx=200,dy=10,dur=0.7) click@2.15"></i>
    </div>
  </section>

  <!-- 5 黑金：大字 + 玻璃卡片 -->
  <section class="scene theme-gold center" id="s5" data-d="4" data-in="flash">
    <div class="layer" data-make="dust" data-n="50" data-fx="drift@0(x=-60,y=-30)"></div>
    <div class="t-en" data-fx="focus-in@0.2">annual capex guidance</div>
    <div class="t-hero" style="margin-top:20px" data-fx="zoom-settle@0.3"><span data-fx="count@0.4(dur=1.4)">7,000</span><span class="unit">亿美元</span></div>
    <div class="row" style="margin-top:60px;gap:30px" data-fx="each:flip-in@1.1(stagger=0.12)">
      <div class="card" style="width:300px">芯片</div><div class="card hot" style="width:300px">算力设施</div><div class="card" style="width:300px">云和大模型</div>
    </div>
  </section>

  <!-- 6 像素：方块拼字 + 像素窗口 + 能量条 -->
  <section class="scene theme-pixel" id="s6" data-d="4.5" data-in="pixelate(cols=24)">
    <div class="fx-chapters" data-make="chapters" data-labels="开场,写周报,装太多,怎么写,总结" data-fx="chapter@0.2(i=2,dur=0.01) chapter@2.4(i=3)"></div>
    <div class="abs" style="left:150px;top:160px" data-make="pixels" data-text="SKILL?" data-size="26" data-colors="#3fbf5a,#2f7de1,#ffcf3f,#1d1b19,#e0463a" data-fx="each:pixel-in@0.2(order=random,stagger=0.012)"></div>
    <div class="abs fx-window" style="left:1100px;top:170px;width:620px" data-fx="pop-in@1.2(from=0.6)">
      <div class="fx-win-bar">Skill 本身</div>
      <div class="fx-win-body col"><span class="ptag">写周报</span><span class="t-pixel" style="font-size:28px">装太多反而选不中</span></div>
    </div>
    <div class="abs pbar" style="left:1780px;top:520px"><i data-fx="fill@1.8(dir=y,to=82,dur=1.4,ease=steps(8))"></i></div>
    <div class="abs ptag" style="left:1260px;top:720px" data-fx="stamp-in@2.6">✔ 选对了</div>
  </section>
</div>

<script>
  FX.subtitles([
    [0.2, 2.0, '睡觉前我只给 AI 发了一段话'],
    [2.0, 4.0, '它就自动做出了这条{深度}视频'],
    [4.2, 8.4, '效率、质量、速度，{一次全拿}'],
    [8.6, 12.4, '播放基本集中在开播的那几个小时'],
    [12.6, 17.4, '几个窗口同时跑，不用一步一步等'],
    [17.6, 21.4, '资本开支加起来超过{七千亿美元}'],
  ], { style: 'pill' });
  FX.build();
</script>
</body>
</html>
