<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="motion-lib — Declarative HTML to MP4 Motion Library">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#090910"/>
      <stop offset="0.55" stop-color="#100e1f"/>
      <stop offset="1" stop-color="#0a101d"/>
    </linearGradient>
    <radialGradient id="glowL" cx="22%" cy="18%" r="48%">
      <stop offset="0" stop-color="#8453e8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8453e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="84%" cy="82%" r="45%">
      <stop offset="0" stop-color="#45dcc3" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#45dcc3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="52" y1="75" x2="520" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#efeaff"/>
      <stop offset="1" stop-color="#c4abff"/>
    </linearGradient>
    <linearGradient id="headNeedle" x1="0" y1="82" x2="0" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a8ff57"/>
      <stop offset="0.5" stop-color="#6fd3ff"/>
      <stop offset="1" stop-color="#8453e8" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#8453e8" stroke-width="0.6" opacity="0.12"/>
    </pattern>
    <style>
      .f-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .f-mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace; }
      @keyframes scrub {
        0%   { transform: translateX(0px); }
        100% { transform: translateX(346px); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.35; }
      }
      @keyframes barGlow1 { 0%,4% { opacity: 0.55; } 8%,38% { opacity: 1; } 48%,100% { opacity: 0.68; } }
      @keyframes barGlow2 { 0%,12% { opacity: 0.55; } 18%,46% { opacity: 1; } 56%,100% { opacity: 0.68; } }
      @keyframes barGlow3 { 0%,20% { opacity: 0.55; } 26%,72% { opacity: 1; } 82%,100% { opacity: 0.68; } }
      @keyframes barGlow4 { 0%,8% { opacity: 0.55; } 14%,76% { opacity: 1; } 86%,100% { opacity: 0.68; } }
      @keyframes barGlow5 { 0% { opacity: 0.72; } 15%,92% { opacity: 1; } 100% { opacity: 0.72; } }
      .playhead { animation: scrub 5.2s linear infinite; }
      .live-dot { animation: pulseDot 1.8s ease-in-out infinite; }
      .b1 { animation: barGlow1 5.2s linear infinite; }
      .b2 { animation: barGlow2 5.2s linear infinite; }
      .b3 { animation: barGlow3 5.2s linear infinite; }
      .b4 { animation: barGlow4 5.2s linear infinite; }
      .b5 { animation: barGlow5 5.2s linear infinite; }
    </style>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="22" fill="url(#glowL)"/>
  <rect width="1200" height="340" rx="22" fill="url(#glowR)"/>
  <rect x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="#2c2648" stroke-width="1.5"/>

  <!-- Left Column: Brand & Declarative Pitch -->
  <rect x="52" y="36" width="386" height="28" rx="14" fill="#18142c" stroke="#47357a" stroke-width="1"/>
  <circle class="live-dot" cx="69" cy="50" r="4" fill="#a8ff57"/>
  <text x="82" y="54" class="f-mono" font-size="11.5" font-weight="700" fill="#d5befe" letter-spacing="0.8">DECLARATIVE HTML → MP4 ENGINE · v1.4</text>

  <text x="50" y="136" class="f-sans" font-size="76" font-weight="900" fill="url(#titleGrad)" letter-spacing="-2.2">motion-lib</text>

  <!-- Inline Code Sample Pill -->
  <rect x="52" y="156" width="584" height="36" rx="9" fill="#12121c" stroke="#2d2b42" stroke-width="1"/>
  <text x="68" y="179" class="f-mono" font-size="13" fill="#8b8ba0">&lt;h1 <tspan fill="#d5befe" font-weight="700">data-fx</tspan>=<tspan fill="#a8ff57">"mask-rise@0.2 marker@1.4"</tspan>&gt;<tspan fill="#f4f4fa">Frame-Accurate Video</tspan>&lt;/h1&gt;</text>

  <text x="52" y="225" class="f-sans" font-size="15.5" font-weight="500" fill="#b4b4c8">一行属性声明时间线 · 逐帧确定性可复现 · 零打包离线直出 1080p / 60fps 视频</text>

  <!-- Bottom Feature Pills -->
  <g transform="translate(52, 252)">
    <rect x="0" y="0" width="108" height="32" rx="8" fill="#21183c" stroke="#6c44c9" stroke-width="1"/>
    <text x="54" y="20.5" text-anchor="middle" class="f-mono" font-size="12" font-weight="700" fill="#dfd2ff">153 Effects</text>

    <rect x="116" y="0" width="126" height="32" rx="8" fill="#261f12" stroke="#9e782f" stroke-width="1"/>
    <text x="179" y="20.5" text-anchor="middle" class="f-mono" font-size="12" font-weight="700" fill="#f5cf7b">20 Transitions</text>

    <rect x="250" y="0" width="122" height="32" rx="8" fill="#102233" stroke="#2d74a8" stroke-width="1"/>
    <text x="311" y="20.5" text-anchor="middle" class="f-mono" font-size="12" font-weight="700" fill="#82d8ff">17 Generators</text>

    <rect x="380" y="0" width="92" height="32" rx="8" fill="#291519" stroke="#a63c46" stroke-width="1"/>
    <text x="426" y="20.5" text-anchor="middle" class="f-mono" font-size="12" font-weight="700" fill="#ff969e">5 Themes</text>

    <rect x="480" y="0" width="124" height="32" rx="8" fill="#0f2620" stroke="#2d8f74" stroke-width="1"/>
    <text x="542" y="20.5" text-anchor="middle" class="f-mono" font-size="12" font-weight="700" fill="#7bf2cc">2D IK + 3D VRM</text>
  </g>

  <!-- Right Column: Animated Timeline Window -->
  <g>
    <rect x="684" y="30" width="472" height="280" rx="16" fill="#0d0d16" stroke="#2c2946" stroke-width="1.2"/>
    <path d="M684 46a16 16 0 0 1 16-16h440a16 16 0 0 1 16 16v18H684z" fill="#151524"/>
    <line x1="684" y1="64" x2="1156" y2="64" stroke="#26243d" stroke-width="1"/>
    <circle cx="704" cy="47" r="4.8" fill="#ff5f57"/>
    <circle cx="720" cy="47" r="4.8" fill="#febc2e"/>
    <circle cx="736" cy="47" r="4.8" fill="#28c840"/>
    <text x="756" y="51" class="f-mono" font-size="11.5" fill="#9d9ab8">FX.build() · paused GSAP timeline · 60fps</text>

    <!-- Ruler -->
    <rect x="684" y="64" width="472" height="26" fill="#11111d"/>
    <line x1="684" y1="90" x2="1156" y2="90" stroke="#232138" stroke-width="1"/>
    <line x1="786" y1="64" x2="786" y2="310" stroke="#232138" stroke-width="1"/>
    <text x="700" y="81" class="f-mono" font-size="10.5" fill="#6d6a88">ELEMENT</text>

    <!-- Ruler Ticks (x = 794 .. 1140, span = 346px => 86.5px/s) -->
    <g class="f-mono" font-size="10" fill="#6d6a88">
      <text x="794" y="81">0.0s</text>
      <text x="875" y="81">1.0s</text>
      <text x="961" y="81">2.0s</text>
      <text x="1048" y="81">3.0s</text>
      <text x="1122" y="81">4.0s</text>
    </g>
    <g stroke="#1b1a2e" stroke-width="1" stroke-dasharray="3 3">
      <line x1="880.5" y1="90" x2="880.5" y2="306"/>
      <line x1="967" y1="90" x2="967" y2="306"/>
      <line x1="1053.5" y1="90" x2="1053.5" y2="306"/>
    </g>

    <!-- Track 1 -->
    <text x="700" y="118" class="f-mono" font-size="11" fill="#a8a5c2">h1.title</text>
    <g class="b1">
      <rect x="811" y="100" width="138" height="26" rx="6" fill="#5e35b1" fill-opacity="0.38" stroke="#9b72ff" stroke-width="1.2"/>
      <text x="821" y="117" class="f-mono" font-size="11" font-weight="600" fill="#ede4ff">mask-rise@0.2</text>
    </g>

    <!-- Track 2 -->
    <text x="700" y="159" class="f-mono" font-size="11" fill="#a8a5c2">b.stat</text>
    <g class="b2">
      <rect x="846" y="141" width="96" height="26" rx="6" fill="#8f681d" fill-opacity="0.38" stroke="#e4b256" stroke-width="1.2"/>
      <text x="856" y="158" class="f-mono" font-size="11" font-weight="600" fill="#ffe4a8">count@0.6</text>
      <rect x="954" y="141" width="106" height="26" rx="6" fill="#8c2622" fill-opacity="0.38" stroke="#ff6b6b" stroke-width="1.2"/>
      <text x="964" y="158" class="f-mono" font-size="11" font-weight="600" fill="#ffc4c4">marker@1.8</text>
    </g>

    <!-- Track 3 -->
    <text x="700" y="200" class="f-mono" font-size="11" fill="#a8a5c2">#router</text>
    <g class="b3">
      <rect x="868" y="182" width="186" height="26" rx="6" fill="#115c50" fill-opacity="0.42" stroke="#45dcc3" stroke-width="1.2"/>
      <text x="878" y="199" class="f-mono" font-size="11" font-weight="600" fill="#b3fff0">circuit@0.9(packets=4)</text>
    </g>

    <!-- Track 4 -->
    <text x="700" y="241" class="f-mono" font-size="11" fill="#a8a5c2">stage3d</text>
    <g class="b4">
      <rect x="824" y="223" width="238" height="26" rx="6" fill="#163e6c" fill-opacity="0.42" stroke="#6fd3ff" stroke-width="1.2"/>
      <text x="834" y="240" class="f-mono" font-size="11" font-weight="600" fill="#cdeeff">galaxy3d@0.35 · orbit3d</text>
    </g>

    <!-- Track 5 -->
    <text x="700" y="282" class="f-mono" font-size="11" fill="#a8a5c2">vrm.host</text>
    <g class="b5">
      <rect x="794" y="264" width="336" height="26" rx="6" fill="#6b1d49" fill-opacity="0.42" stroke="#ff7ab8" stroke-width="1.2"/>
      <text x="804" y="281" class="f-mono" font-size="11" font-weight="600" fill="#ffd1e8">vrm3d@0 · ik3d · vrm-talk · SpringBone</text>
    </g>

    <!-- Animated Playhead -->
    <g class="playhead">
      <line x1="794" y1="86" x2="794" y2="302" stroke="url(#headNeedle)" stroke-width="2"/>
      <polygon points="788,84 800,84 794,93" fill="#a8ff57"/>
      <circle cx="794" cy="93" r="3" fill="#ffffff"/>
    </g>
  </g>
</svg>
