    <path d="M0 52h5M91 52h5" stroke="#A8FF57" stroke-width="1.4" opacity=".85"/>
    <rect x="6.5" y="6.5" width="83" height="83" rx="21" fill="none" stroke="#79B94A" stroke-width=".9" opacity=".82"/>
    <rect x="9" y="9" width="78" height="78" rx="19" fill="none" stroke="#A8FF57" stroke-width=".45" opacity=".6"/>
    <rect x="29" y="26" width="38" height="38" rx="12" fill="#04100C" opacity=".96"/>
    <path d="M36 41c5-10 22-13 28-2 6 10-2 22-12 24-9 2-18-2-20-9" fill="none" stroke="#E9F0E7" stroke-width="1.55" stroke-linecap="round" opacity=".45"/>
    <path d="M37 34.5v22M59 34.5v22M37.5 45.5h21" fill="none" stroke="url(#logoMark)" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)"/>
    <circle cx="35.2" cy="52.4" r="2.15" fill="#B8FF5A"/>
    <circle cx="35.6" cy="56.5" r="2.55" fill="#FFB84A"/>
    <circle cx="61.1" cy="34.8" r="2.55" fill="#F4F8E8"/>
    <text x="48" y="78.5" fill="#A8FF57" class="f-mono" font-size="6.2" font-weight="900" letter-spacing="1.15" text-anchor="middle">AUTO</text>
  </g>

  <rect x="154" y="26" width="356" height="24" rx="12" fill="#11291d" stroke="#3b7548" stroke-width="1"/>
