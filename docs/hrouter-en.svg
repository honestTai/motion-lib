<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 196" width="1200" height="196" role="img" aria-label="HRouter — One API Key for Claude, GPT, Gemini &amp; Grok">
  <defs>
    <linearGradient id="hrBg" x1="0" y1="0" x2="1200" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#091711"/>
      <stop offset="0.52" stop-color="#07120e"/>
      <stop offset="1" stop-color="#091816"/>
    </linearGradient>
    <radialGradient id="hrGlow" cx="15%" cy="50%" r="55%">
      <stop offset="0" stop-color="#a8ff57" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#45dcc3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoBg" x1="8" y1="4" x2="88" y2="94" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1A13"/>
      <stop offset="1" stop-color="#06100C"/>
    </linearGradient>
    <linearGradient id="logoMark" x1="36" y1="34" x2="62" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A8FF57"/>
      <stop offset="0.45" stop-color="#68E6B2"/>
      <stop offset="1" stop-color="#45DCC3"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A8FF57"/>
      <stop offset="1" stop-color="#45DCC3"/>
    </linearGradient>
    <pattern id="hrGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#5F8D42" stroke-width="0.55" opacity="0.16"/>
    </pattern>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .f-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .f-mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace; }
      @keyframes hubPulse {
        0%, 100% { stroke-opacity: 0.65; }
        50%      { stroke-opacity: 1; }
      }
      .hub-box { animation: hubPulse 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="2" y="2" width="1196" height="192" rx="20" fill="url(#hrBg)"/>
  <rect x="2" y="2" width="1196" height="192" rx="20" fill="url(#hrGrid)"/>
  <rect x="2" y="2" width="1196" height="192" rx="20" fill="url(#hrGlow)"/>
  <rect x="2" y="2" width="1196" height="192" rx="20" fill="none" stroke="#3c6e37" stroke-width="1.5"/>
  <rect x="6" y="6" width="1188" height="184" rx="17" fill="none" stroke="#a8ff57" stroke-opacity="0.22" stroke-width="0.8"/>

  <g transform="translate(26, 44) scale(1.125)">
