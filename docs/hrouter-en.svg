    </circle>
    <circle r="3.4" fill="#ffb84a" filter="url(#neon)">
      <animateMotion dur="2.2s" begin="-1.65s" repeatCount="indefinite" path="M 880 98 L 1020 98 L 1020 157 L 1046 157"/>
    </circle>

    <rect x="804" y="81" width="76" height="34" rx="9" fill="#0d2118" stroke="#5da865" stroke-width="1.2"/>
    <text x="842" y="102" text-anchor="middle" class="f-mono" font-size="11" font-weight="700" fill="#e6f9ec">1 API Key</text>

    <rect class="hub-box" x="926" y="75" width="70" height="46" rx="11" fill="#071710" stroke="#a8ff57" stroke-width="1.6"/>
    <text x="961" y="96" text-anchor="middle" class="f-mono" font-size="11.5" font-weight="800" fill="#a8ff57">HRouter</text>
    <text x="961" y="111" text-anchor="middle" class="f-mono" font-size="9" font-weight="700" fill="#68e6b2">AUTO</text>

    <rect x="1046" y="25" width="124" height="30" rx="8" fill="#0e1e18" stroke="#3c6e4e" stroke-width="1"/>
    <circle cx="1062" cy="40" r="4" fill="#ffb84a"/>
    <text x="1074" y="44.5" class="f-mono" font-size="12" font-weight="700" fill="#f2faf5">Claude 4.x</text>

    <rect x="1046" y="64" width="124" height="30" rx="8" fill="#0e1e18" stroke="#3c6e4e" stroke-width="1"/>
    <circle cx="1062" cy="79" r="4" fill="#68e6b2"/>
    <text x="1074" y="83.5" class="f-mono" font-size="12" font-weight="700" fill="#f2faf5">GPT / Codex</text>

    <rect x="1046" y="103" width="124" height="30" rx="8" fill="#0e1e18" stroke="#3c6e4e" stroke-width="1"/>
