    <path d="M 996 98 L 1020 98 L 1020 40 L 1046 40" fill="none" stroke="#2f6644" stroke-width="1.8"/>
    <path d="M 996 98 L 1020 98 L 1020 79 L 1046 79" fill="none" stroke="#2f6644" stroke-width="1.8"/>
    <path d="M 996 98 L 1020 98 L 1020 118 L 1046 118" fill="none" stroke="#2f6644" stroke-width="1.8"/>
    <path d="M 996 98 L 1020 98 L 1020 157 L 1046 157" fill="none" stroke="#2f6644" stroke-width="1.8"/>

